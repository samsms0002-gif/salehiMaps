name: Build Windows app

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --onefile --name salehiMaps map_viewer.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: salehiMaps-windows
          path: dist/salehiMaps.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/salehiMaps.exe -Algorithm SHA256).Hash
          "$hash  salehiMaps.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" dist/salehiMaps.exe dist/SHA256SUMS.txt --title "salehiMaps ${{ github.ref_name }}" --generate-notes
